<style>
:root{--pink:#FF0090;--yellow:#FFCC00;--ink:#2B1066;--soft:#6b6290;--bg:#F4F1FA;--line:#DAD3EC;--ok:#12a36b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.side{position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:2px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px}
.side img.logo{width:100%;border-radius:18px;margin-bottom:10px}
.lbl{font-size:12px;font-weight:600;color:var(--soft);letter-spacing:.08em;margin:10px 4px 2px}
.nav a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;font-weight:600;cursor:pointer;color:var(--soft);margin-bottom:4px}
.nav a.on{background:var(--pink);color:#fff;box-shadow:0 4px 0 #b3006a}
.foot{margin-top:auto;border:2px solid var(--line);border-radius:16px;padding:10px;font-size:13px;color:var(--soft);display:flex;gap:10px;align-items:center}
.foot img{width:42px;border-radius:12px}
main{margin-left:250px;padding:22px;max-width:1150px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.mlogo{display:none;height:46px;border-radius:12px}
.period{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 8px 6px 16px;margin-left:auto}
.period small{display:block;font-size:11px;color:var(--soft)}
.period b{font-size:16px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;width:36px;height:36px;font-size:16px;cursor:pointer;color:var(--ink);font-weight:700}
h1{font-size:24px;margin:0 0 14px;font-weight:800}
h2{font-size:16px;margin:0;font-weight:700}
.box{background:#fff;border:2px solid var(--line);border-radius:26px;padding:18px;margin-bottom:16px}.box .card{background:#faf8ff;box-shadow:none}.bt{margin:0;font-size:15px;letter-spacing:.04em}.box .lbl{margin:16px 2px 8px}
.grid{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 4px 0 var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:28px;font-weight:800;margin:6px 0}
.sub{font-size:13px;color:var(--soft)}
.bar{height:12px;background:#ece7f7;border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pink)}
.bar.y i{background:var(--yellow)}.bar.g i{background:var(--ok)}
.btn{border:2px solid var(--ink);background:var(--yellow);color:var(--ink);font:700 14px 'Poppins',sans-serif;padding:10px 16px;border-radius:14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn.pk{background:var(--pink);color:#fff;border-color:#b3006a;box-shadow:0 3px 0 #b3006a}
.btn.ghost{background:#fff;border-color:var(--line);box-shadow:none;color:var(--soft)}
.btn:active{transform:translateY(2px)}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#ffe3f3;color:var(--pink)}
.tag.ok{background:#dcf7ec;color:var(--ok)}
input{font:600 15px 'Poppins',sans-serif;border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;color:var(--ink);background:#fff}
input:focus{outline:none;border-color:var(--pink)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.f label{font-size:12px;color:var(--soft);font-weight:600;display:block;margin-bottom:4px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px}
.days button{height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font:600 13px 'Poppins',sans-serif;color:var(--soft);cursor:pointer}
.days button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.days button.hoy{border-color:var(--pink);color:var(--pink)}
.days button.on.hoy{color:#fff}
.li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.li a{color:var(--pink);cursor:pointer;font-weight:700}
.fund .row2{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.fund .bar.tall{height:22px}
.fund input[type=range]{padding:0;border:0;height:34px;accent-color:var(--pink);background:transparent}
.fund .chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.fund .chips button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:700 13px 'Poppins',sans-serif;color:var(--ink);cursor:pointer}
.fund .chips button:active{background:var(--yellow)}
.fund .mid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;z-index:5}
.tabs a{flex:1;text-align:center;padding:8px 4px;border-radius:14px;font-size:11px;font-weight:600;color:var(--soft);cursor:pointer}
.tabs a span{display:block;font-size:20px}
.tabs a.on{background:var(--pink);color:#fff}
@media(max-width:900px){.side{display:none}main{margin:0;padding:14px 14px 100px;padding-top:calc(14px + env(safe-area-inset-top))}.tabs{display:flex}.mlogo{display:block}.period{margin-left:auto}}
</style>
</head>

<script>
const KEY='cg_finanzas_v1';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{cfg:{pr:236,marc:7,pen:7},d:{}};
S.cfg.alq=S.cfg.alq||750;S.cfg.fd=S.cfg.fd||34;S.cfg.mped=S.cfg.mped||170;S.cfg.wa=S.cfg.wa||'51906591534';
if(S.ini===undefined){S.ini=0;for(const mo in S.d){const a=S.d[mo].as||[],i=a.findIndex(x=>+x.m===429);if(i>=0){S.ini=+a[i].m;a.splice(i,1);break}}localStorage.setItem(KEY,JSON.stringify(S))}
const p2=n=>String(n).padStart(2,'0'),N=new Date();
const TODAY=N.getFullYear()+'-'+p2(N.getMonth()+1),TD=N.getDate();
let ym=TODAY,view='inicio';
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const M=()=>{const m=S.d[ym]||(S.d[ym]={svc:{luz:{m:0,p:0,v:''},agua:{m:0,p:0,v:''},internet:{m:0,p:0,v:''}},pr:[],marc:{},pen:{}});m.sv=m.sv||[];m.mp=m.mp||[];m.as=m.as||[];m.ap=m.ap||[];for(const k of['l_luz','l_agua','l_internet'])m.svc[k]=m.svc[k]||{m:0,p:0,v:''};return m};
const START='2026-10';
const fmt=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{maximumFractionDigits:2});
const dim=()=>{const[y,m]=ym.split('-');return new Date(y,m,0).getDate()};
const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;
const bar=(a,b,c='')=>`<div class="bar ${c}"><i style="width:${pct(a,b)}%"></i></div>`;
const NAV=[['inicio','🏠','Inicio'],['personal','💡','Personal'],['cero','🍧','Cero Grados'],['config','⚙️','Ajustes']];
const SV={luz:['💡','Luz'],agua:['💧','Agua'],internet:['📶','Internet']};
function mv(d){let[y,m]=ym.split('-').map(Number);m+=d;if(m>12){m=1;y++}if(m<1){m=12;y--}const n=y+'-'+p2(m);if(n<START)return;ym=n;render()}
function go(v){view=v;render();scrollTo(0,0)}
function accum(k){let n=0;for(const mo in S.d)if(mo>=START)n+=Object.values(S.d[mo][k]||{}).filter(Boolean).length;return n*S.cfg[k]}
function sumAll(k){let t=0;for(const mo in S.d)if(mo>=START)t+=(S.d[mo][k]||[]).reduce((a,x)=>a+ +x.m,0);return t}
function sums(){const m=M(),c=S.cfg,cnt=k=>Object.values(m[k]).filter(Boolean).length;
  return{paid:Object.values(m.svc).filter(s=>s.p).length,
  svcTot:Object.values(m.svc).reduce((a,s)=>a+ +s.m,0),
  svcPaid:Object.values(m.svc).reduce((a,s)=>a+(s.p?+s.m:0),0),
  alSaldo:sumAll('as')-sumAll('ap'),alPaid:m.ap.reduce((a,x)=>a+ +x.m,0),prPaid:m.pr.reduce((a,x)=>a+ +x.m,0),saldo:sumAll('sv')-sumAll('pr'),
  mc:cnt('marc')*c.marc,pc:cnt('pen')*c.pen,mg:dim()*c.marc,pg:dim()*c.pen,mt:accum('marc'),pt:accum('pen')}}
const EST={luz:30,agua:30,internet:69,l_luz:40,l_agua:30,l_internet:30};
function fondo(){const m=M(),c=S.cfg;let hog=0,loc=0,real=0;
  for(const k in EST){const x=m.svc[k],v=+x.m>0?+x.m:EST[k];if(+x.m>0)real++;if(k[0]==='l'&&k[1]==='_')loc+=v;else hog+=v}
  const meta=c.alq+hog+loc;let pagSvc=0;const pagos=[];
  const NM={luz:'Luz hogar',agua:'Agua hogar',internet:'Internet hogar',l_luz:'Luz local',l_agua:'Agua local',l_internet:'Internet local'};
  const ml=mo=>{const[y,mm]=mo.split('-');const t=new Date(y,mm-1,1).toLocaleDateString('es-PE',{month:'long'});return t[0].toUpperCase()+t.slice(1)};
  for(const mo of Object.keys(S.d).sort())if(mo>=START){
    for(const k in S.d[mo].svc){const x=S.d[mo].svc[k];if(x.p){pagSvc+=+x.m;pagos.push({t:NM[k]||k,mo:ml(mo),m:+x.m})}}
    for(const x of (S.d[mo].ap||[]))pagos.push({t:'Alquiler local',mo:ml(mo),m:+x.m})}
  const saldo=(+S.ini||0)+sumAll('as')-sumAll('ap')-pagSvc,mes=M().as.reduce((a,x)=>a+ +x.m,0);
  const hs=new Date().toLocaleDateString('es-PE'),hoy=M().as.filter(x=>x.f===hs).reduce((a,x)=>a+ +x.m,0);
  return{meta,hog,loc,real,saldo,mes,hoy,pagos,totPag:pagos.reduce((a,x)=>a+x.m,0)}}
function fdSync(a,b){document.getElementById(b).value=document.getElementById(a).value;document.getElementById('fdl').textContent=fmt(document.getElementById('fdn').value)}
function setIni(){const v=prompt('Ahorro acumulado del 1 al 30 de octubre (S/):',S.ini||0);if(v===null)return;S.ini=parseFloat(v)||0;save();render()}
function addFd(v){v=parseFloat(v!==undefined?v:document.getElementById('fdn').value);if(!(v>0))return;
  M().as.push({f:new Date().toLocaleDateString('es-PE'),m:v});save();render()}
function fdCard(){const sm=sums(),f=fondo(),c=S.cfg,m=M(),mesActual=ym===TODAY,dia=mesActual?TD:dim(),
  ideal=Math.min(f.meta,c.fd*dia),dif=f.mes-ideal,falta=Math.max(0,f.meta-f.saldo),
  li=m.as.map((x,i)=>`<div class="li"><span>${x.f}</span><span><b>${fmt(x.m)}</b> &nbsp;<a onclick="delAl(${i})">quitar</a></span></div>`).join('');
  return`<div class="card fund"><div class="row"><h2>🐷 Fondo hogar y local</h2><span class="tag ${f.saldo>=f.meta?'ok':''}">Meta ${fmt(c.fd)} / día</span></div>
  <div class="sub" style="margin-top:8px">Ahorrado (disponible)</div><div class="big">${fmt(f.saldo)}</div>
  <div class="bar tall ${f.saldo>=f.meta?'g':''}"><i style="width:${pct(f.saldo,f.meta)}%"></i></div>
  <div class="sub">${pct(f.saldo,f.meta)}% de ${fmt(f.meta)} · ${falta>0?'Faltan '+fmt(falta)+' (~'+Math.ceil(falta/c.fd)+' días a '+fmt(c.fd)+')':'¡Ya cubres todo el mes! 🎉'}</div>
  <div style="margin-top:14px"><div class="row"><b style="font-size:14px">Hoy</b><span class="sub">${fmt(f.hoy)} de ${fmt(c.fd)}</span></div>${bar(f.hoy,c.fd,f.hoy>=c.fd?'g':'y')}</div>
  <div class="lbl" style="margin:14px 0 2px">¿CUÁNTO AHORRASTE HOY?</div>
  <div class="row"><b id="fdl" style="font-size:22px">${fmt(c.fd)}</b><span class="sub">desliza o escribe</span></div>
  <input id="fdr" type="range" min="0" max="${Math.max(80,c.fd*2)}" step="1" value="${c.fd}" oninput="fdSync('fdr','fdn')">
  <div class="chips">${[c.fd,28,20,15,10].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<button onclick="document.getElementById('fdn').value=${v};fdSync('fdn','fdr')">${v===c.fd?'✓ ':''}${v}</button>`).join('')}</div>
  <div class="mid"><input id="fdn" type="number" inputmode="decimal" value="${c.fd}" oninput="fdSync('fdn','fdr')"><button class="btn pk" onclick="addFd()">Guardar ahorro</button></div>
  <div class="sub" style="margin-top:12px">${mesActual?'Ritmo del mes: ideal '+fmt(ideal)+' · llevas '+fmt(f.mes)+' → '+(dif>=0?'vas adelantado +'+fmt(dif):'te faltan '+fmt(-dif)+' para ir al día'):'Ahorrado en este mes: '+fmt(f.mes)}</div>
  <div class="lbl" style="margin:14px 0 4px">DE DÓNDE SALE EL SALDO</div>
  <div class="row2"><span>📅 Acumulado 1–30 oct</span><span><b>${fmt(S.ini)}</b> &nbsp;<a style="color:var(--pink);cursor:pointer;font-weight:700" onclick="setIni()">editar</a></span></div>
  <div class="row2"><span>➕ Ahorrado en este mes</span><b>${fmt(f.mes)}</b></div>
  <div class="row2"><span>➖ Ya pagado (todos los meses)</span><b>${fmt(f.totPag)}</b></div>
  ${f.pagos.map(x=>`<div class="row2" style="padding-left:18px;color:var(--soft)"><span>✓ ${x.t} · ${x.mo}</span><span>${fmt(x.m)}</span></div>`).join('')||'<div class="sub" style="padding-left:18px">Aún no hay pagos registrados</div>'}
  <div class="lbl" style="margin:14px 0 4px">LO QUE CUBRE ESTE MES</div>
  <div class="row2"><span>🏪 Alquiler</span><b>${fmt(c.alq)}</b></div>
  <div class="row2"><span>🏪 Servicios del local</span><b>${fmt(f.loc)}</b></div>
  <div class="row2"><span>🏠 Servicios del hogar</span><b>${fmt(f.hog)}</b></div>
  <div class="row2"><span><b>Total a juntar</b></span><b>${fmt(f.meta)}</b></div>
  ${f.real<6?`<div class="sub" style="margin-top:6px">${f.real}/6 servicios con monto real; el resto usa un estimado hasta que lo ingreses.</div>`:''}
  <div style="margin-top:12px"><div class="lbl" style="margin:0 0 4px">AHORROS DE ESTE MES</div>${li||'<div class="sub">Aún sin ahorros este mes</div>'}</div></div>`}
function mpInfo(){const ped=S.cfg.mped;let T=0;
  for(const mo of Object.keys(S.d).sort())if(mo>=START)for(const x of (S.d[mo].mp||[]))T+=+x.m;
  const r=T%ped;return{saldo:accum('marc')-T,T,entr:r,falta:ped-r,ped}}
function addMp(){const v=parseFloat(document.getElementById('mpn').value);if(!(v>0))return;const i=mpInfo();
  if(v>i.saldo&&!confirm('Solo tienes '+fmt(i.saldo)+' ahorrados en marcianos. ¿Registrar igual?'))return;
  M().mp.push({f:new Date().toLocaleDateString('es-PE'),m:v,n:document.getElementById('mpo').value||''});save();render()}
function delMp(i){M().mp.splice(i,1);save();render()}
function mpCard(){const i=mpInfo(),m=M(),sug=Math.max(0,Math.min(i.saldo,i.falta)),
  li=m.mp.map((x,k)=>`<div class="li"><span>${x.f}${x.n?' · '+x.n:''}</span><span><b>${fmt(x.m)}</b> &nbsp;<a onclick="delMp(${k})">quitar</a></span></div>`).join('');
  return`<div class="card"><div class="row"><h2>📦 Pedido de marcianos</h2><span class="tag ${i.saldo>=i.falta?'ok':''}">Completo ${fmt(i.ped)}</span></div>
  <div class="sub" style="margin-top:8px">Disponible (ahorrado − entregado)</div><div class="big">${fmt(i.saldo)}</div>
  <div class="sub">Pedido en curso: ya entregaste ${fmt(i.entr)} de ${fmt(i.ped)} · faltan ${fmt(i.falta)} por entregar</div>${bar(i.entr,i.ped,'y')}
  <div class="sub">${i.saldo>=i.falta?'¡Ya alcanza para completar el pedido!':'Tu ahorro cubre '+fmt(i.saldo)+' de los '+fmt(i.falta)+' que faltan · faltan '+fmt(i.falta-i.saldo)}</div>${bar(i.saldo,i.falta,i.saldo>=i.falta?'g':'')}
  <div class="f"><div><label>Monto entregado (S/)</label><input id="mpn" type="number" inputmode="decimal" value="${sug||''}" placeholder="0"></div><div><label>Nota (opcional)</label><input id="mpo" type="text" placeholder="Ej: 1ra tanda"></div></div>
  <button class="btn pk" style="width:100%" onclick="addMp()">Registrar entrega para preparar</button>
  <div style="margin-top:12px"><div class="lbl" style="margin:0 0 4px">ENTREGAS DE ESTE MES</div>${li||'<div class="sub">Aún sin entregas este mes</div>'}</div></div>`}
function resumen(){const f=fondo(),sm=sums(),mp=mpInfo(),c=S.cfg,
  hoy=new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}),
  mes=new Date().toLocaleDateString('es-PE',{month:'long'});
  const pctF=pct(f.saldo,f.meta);
  return[`*CERO GRADOS · Resumen del día*`,hoy[0].toUpperCase()+hoy.slice(1),``,
  `🏠 *LOCAL Y CASA*`,`Ahorrado: ${fmt(f.saldo)} de ${fmt(f.meta)} (${pctF}%)`,`Hoy: ${fmt(f.hoy)} de ${fmt(c.fd)}`,``,
  `👧 *PENSIÓN MEGAN*`,`Acumulado: ${fmt(sm.pt)}`,`Este mes: ${fmt(sm.pc)} de ${fmt(sm.pg)}`,``,
  `🤝 *PRÉSTAMO SRA. NOA*`,`Ahorrado: ${fmt(sm.saldo)} de ${fmt(c.pr)}`,sm.saldo>=c.pr?'✅ Ya alcanza para la cuota':`Faltan ${fmt(c.pr-sm.saldo)}`,``,
  `🍧 *MARCIANOS*`,`Disponible: ${fmt(mp.saldo)}`,`Pedido en curso: entregado ${fmt(mp.entr)} de ${fmt(mp.ped)}`,
  mp.saldo>=mp.falta?'✅ Ya alcanza para completar el pedido':`Faltan ${fmt(mp.falta-mp.saldo)} para completar`].join('\n')}
function enviarWA(){const n=String(S.cfg.wa||'').replace(/\D/g,'');if(!n){alert('Configura tu número de WhatsApp en Ajustes');return}
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(resumen()),'_blank')}
function tgl(k,d){const m=M();m[k][d]=!m[k][d];save();render()}
function togglePaid(k){const s=M().svc[k];s.p=s.p?0:1;save();render()}
function setSvc(k,f,v){M().svc[k][f]=f==='m'?(parseFloat(v)||0):v;save();render()}
function addSv(){const v=parseFloat(document.getElementById('ab').value);if(!v)return;
  M().sv.push({f:new Date().toLocaleDateString('es-PE'),m:v});save();render()}
function delSv(i){M().sv.splice(i,1);save();render()}
function payCuota(){if(!confirm('¿Registrar el pago de la cuota de '+fmt(S.cfg.pr)+' a la Sra. Noa?'))return;
  M().pr.push({f:new Date().toLocaleDateString('es-PE'),m:S.cfg.pr});save();render()}
function addAl(){const v=parseFloat(document.getElementById('aab').value);if(!v)return;M().as.push({f:new Date().toLocaleDateString('es-PE'),m:v});save();render()}
function delAl(i){M().as.splice(i,1);save();render()}
function payAl(){if(!confirm('¿Registrar el pago del alquiler de '+fmt(S.cfg.alq)+'?'))return;M().ap.push({f:new Date().toLocaleDateString('es-PE'),m:S.cfg.alq});save();render()}
function delAp(i){M().ap.splice(i,1);save();render()}
function delPr(i){M().pr.splice(i,1);save();render()}
function cfg(k,v){S.cfg[k]=parseFloat(v)||0;save();render()}
function days(k){const m=M();let h='';
  for(let d=1;d<=dim();d++)h+=`<button class="${m[k][d]?'on':''} ${ym===TODAY&&d===TD?'hoy':''}" onclick="tgl('${k}',${d})">${d}</button>`;
  return`<div class="days">${h}</div>`}
function daily(k,title,ico,meta){const s=sums(),a=k==='marc'?s.mc:s.pc,g=k==='marc'?s.mg:s.pg,t=k==='marc'?s.mt:s.pt;
  return`<div class="card"><div class="row"><h2>${ico} ${title}</h2><span class="tag ${a>=g?'ok':''}">${fmt(meta)} / día</span></div>
  <div class="sub" style="margin-top:8px">Total ahorrado desde octubre</div><div class="big">${fmt(t)}</div>
  <div class="sub">Este mes: ${fmt(a)} de ${fmt(g)}</div>${bar(a,g,a>=g?'g':'y')}
  <div class="sub">Toca cada día que ya separaste tus ${fmt(meta)}</div>${days(k)}</div>`}
function vInicio(){const s=sums(),c=S.cfg,m=M(),hoy=ym===TODAY,pagada=s.prPaid>=c.pr;
  let h=`<h1>Hola, Enrique 👋</h1><button class="btn" style="width:100%;margin-bottom:14px;background:#25D366;border-color:#128C7E;box-shadow:0 3px 0 #128C7E;color:#fff" onclick="enviarWA()">📲 Enviar resumen del día por WhatsApp</button><div class="grid">
  <div class="card"><div class="row"><h2>💡 Servicios</h2><span class="tag ${s.paid===6?'ok':''}">${s.paid}/6 pagados</span></div>
   <div class="big">${fmt(s.svcPaid)}</div><div class="sub">de ${fmt(s.svcTot)} del mes</div>${bar(s.svcPaid,s.svcTot,'g')}</div>
  <div class="card"><div class="row"><h2>🤝 Préstamo Sra. Noa</h2><span class="tag ${pagada?'ok':''}">${pagada?'Cuota pagada':'Pendiente'}</span></div>
   <div class="big">${fmt(s.saldo)}</div><div class="sub">ahorrado · cuota ${fmt(c.pr)}</div>${bar(s.saldo,c.pr,s.saldo>=c.pr?'g':'')}</div>
  <div class="card"><h2>🍧 Marcianos</h2><div class="big">${fmt(mpInfo().saldo)}</div><div class="sub">disponible · este mes ahorraste ${fmt(s.mc)}</div>${bar(s.mc,s.mg,'y')}</div>
  <div class="card"><h2>👧 Pensión de mi hija</h2><div class="big">${fmt(s.pt)}</div><div class="sub">acumulado · este mes ${fmt(s.pc)}</div>${bar(s.pc,s.pg,'y')}</div>
  ${(()=>{const f=fondo();return`<div class="card"><div class="row"><h2>🐷 Fondo hogar y local</h2><span class="tag ${f.saldo>=f.meta?'ok':''}">${pct(f.saldo,f.meta)}%</span></div><div class="big">${fmt(f.saldo)}</div><div class="sub">de ${fmt(f.meta)} · hoy ${fmt(f.hoy)} de ${fmt(c.fd)}</div>${bar(f.saldo,f.meta,f.saldo>=f.meta?'g':'')}</div>`})()}`;
  if(hoy)h+=`<div class="card"><h2>📅 Hoy, día ${TD}</h2><div class="sub" style="margin:6px 0 12px">Marca lo que ya separaste hoy</div>
   <div style="display:flex;gap:10px;flex-wrap:wrap">
   <button class="btn ${m.marc[TD]?'':'pk'}" onclick="tgl('marc',${TD})">${m.marc[TD]?'✓':''} Marcianos ${fmt(c.marc)}</button>
   <button class="btn ${m.pen[TD]?'':'pk'}" onclick="tgl('pen',${TD})">${m.pen[TD]?'✓':''} Pensión ${fmt(c.pen)}</button></div></div>`;
  return h}
function svcCard(k,t,ico){const s=M().svc[k];return`<div class="card"><div class="row"><h2>${ico} ${t}</h2><span class="tag ${s.p?'ok':''}">${s.p?'Pagado':'Pendiente'}</span></div>
  <div class="f"><div><label>Monto (S/)</label><input type="number" inputmode="decimal" value="${s.m||''}" onchange="setSvc('${k}','m',this.value)"></div>
  <div><label>Vence</label><input type="date" value="${s.v}" onchange="setSvc('${k}','v',this.value)"></div></div>
  <button class="btn ${s.p?'ghost':'pk'}" style="width:100%" onclick="togglePaid('${k}')">${s.p?'Pagado ✓ · deshacer (devuelve '+fmt(s.m)+')':'Marcar pagado · descuenta '+fmt(s.m)+' del fondo'}</button></div>`}
function vPersonal(){const s=sums(),c=S.cfg,m=M(),pag=s.alPaid>=c.alq,falta=Math.max(0,c.alq-s.alSaldo);
  const li=(a,f)=>a.map((x,i)=>`<div class="li"><span>${x.f}</span><span><b>${fmt(x.m)}</b> &nbsp;<a onclick="${f}(${i})">quitar</a></span></div>`).join('');
  return`<h1>Finanzas personales</h1>
  <div class="box"><h2 class="bt">🏠 AHORRO HOGAR Y LOCAL</h2>
  <div class="grid">${fdCard()}</div>
  <div class="lbl">SERVICIOS DEL HOGAR</div><div class="grid">${svcCard('luz','Luz','💡')}${svcCard('agua','Agua','💧')}${svcCard('internet','Internet','📶')}</div>
  <div class="lbl">SERVICIOS DEL LOCAL</div><div class="grid">${svcCard('l_luz','Luz local','💡')}${svcCard('l_agua','Agua local','💧')}${svcCard('l_internet','Internet local','📶')}</div>
  <div class="lbl">ALQUILER DEL LOCAL</div><div class="grid"><div class="card"><div class="row"><h2>🏪 Alquiler</h2><span class="tag ${pag?'ok':''}">${fmt(c.alq)} / mes</span></div>
  <div class="big" style="margin-top:8px">${fmt(c.alq)}</div>
  <div class="sub">${pag?'Pagado este mes ✓':'Pendiente de pago · se descuenta del fondo'}</div>${bar(s.alPaid,c.alq,'g')}
  <button class="btn" style="width:100%;margin-top:10px" onclick="payAl()">Pagar alquiler</button>
  ${m.ap.length?`<div style="margin-top:12px"><div class="lbl" style="margin:0 0 4px">PAGOS DEL ALQUILER</div>${li(m.ap,'delAp')}</div>`:''}</div>
  <div class="card"><div class="row"><h2>Total servicios del mes</h2><b>${fmt(s.svcTot)}</b></div>${bar(s.svcPaid,s.svcTot,'g')}<div class="sub">Pagado ${fmt(s.svcPaid)} · Falta ${fmt(s.svcTot-s.svcPaid)}</div></div></div></div>
  <div class="box"><h2 class="bt">👧 PENSIÓN DE MI HIJA</h2><div class="grid">${daily('pen','Pensión de mi hija','👧',c.pen)}</div></div>`}
function vCero(){const s=sums(),c=S.cfg,m=M(),pagada=s.prPaid>=c.pr,falta=Math.max(0,c.pr-s.saldo);
  const li=(a,f)=>a.map((x,i)=>`<div class="li"><span>${x.f}</span><span><b>${fmt(x.m)}</b> &nbsp;<a onclick="${f}(${i})">quitar</a></span></div>`).join('');
  return`<h1>Cero Grados 🍧</h1><div class="grid"><div class="card"><div class="row"><h2>🤝 Préstamo Sra. Noa</h2><span class="tag ${pagada?'ok':''}">${fmt(c.pr)} / mes</span></div>
  <div class="sub" style="margin-top:8px">Ahorrado para la cuota (acumulado)</div><div class="big">${fmt(s.saldo)}</div>
  <div class="sub">${s.saldo>=c.pr?'¡Ya alcanza para la cuota!':'Falta '+fmt(falta)}${pagada?' · Cuota de este mes pagada ✓':''}</div>${bar(s.saldo,c.pr,s.saldo>=c.pr?'g':'')}
  <div class="f"><div style="grid-column:1/3"><label>¿Cuánto ahorraste hoy? (S/)</label><input id="ab" type="number" inputmode="decimal" placeholder="0"></div></div>
  <button class="btn pk" style="width:100%" onclick="addSv()">Registrar ahorro</button>
  <button class="btn" style="width:100%;margin-top:10px" onclick="payCuota()">Pagar cuota a la Sra. Noa</button>
  <div style="margin-top:12px"><div class="lbl" style="margin:0 0 4px">AHORROS DE ESTE MES</div>${li(m.sv,'delSv')||'<div class="sub">Aún sin ahorros este mes</div>'}</div>
  ${m.pr.length?`<div style="margin-top:12px"><div class="lbl" style="margin:0 0 4px">PAGOS A LA SRA. NOA</div>${li(m.pr,'delPr')}</div>`:''}</div>
  ${mpCard()}${daily('marc','Marcianos','🍧',c.marc)}</div>`}
function vConfig(){const c=S.cfg;return`<h1>Ajustes</h1><div class="grid"><div class="card"><h2>Montos</h2>
  <div class="f"><div style="grid-column:1/3"><label>Cuota mensual préstamo Sra. Noa</label><input type="number" value="${c.pr}" onchange="cfg('pr',this.value)"></div>
  <div><label>Marcianos por día</label><input type="number" value="${c.marc}" onchange="cfg('marc',this.value)"></div>
  <div><label>Pensión por día</label><input type="number" value="${c.pen}" onchange="cfg('pen',this.value)"></div>
  <div style="grid-column:1/3"><label>Ahorro acumulado del 1 al 30 de octubre</label><input type="number" value="${S.ini||0}" onchange="S.ini=parseFloat(this.value)||0;save();render()"></div>
   <div style="grid-column:1/3"><label>WhatsApp para el resumen (con código de país)</label><input type="tel" value="${c.wa}" onchange="S.cfg.wa=this.value.replace(/[^0-9]/g,'');save();render()"></div>
   <div style="grid-column:1/3"><label>Costo de un pedido completo de marcianos</label><input type="number" value="${c.mped}" onchange="cfg('mped',this.value)"></div>
   <div style="grid-column:1/3"><label>Meta de ahorro diaria (hogar y local)</label><input type="number" value="${c.fd}" onchange="cfg('fd',this.value)"></div>
   <div style="grid-column:1/3"><label>Alquiler mensual del local</label><input type="number" value="${c.alq}" onchange="cfg('alq',this.value)"></div></div></div>
  <div class="card"><h2>Respaldo</h2><div class="sub" style="margin:6px 0 12px">Tus datos se guardan en este dispositivo. Descarga un respaldo para pasarlos a otro.</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="exp()">Descargar respaldo</button>
  <button class="btn ghost" onclick="document.getElementById('imp').click()">Importar</button>
  <button class="btn ghost" onclick="if(confirm('¿Borrar todos los datos?')){localStorage.removeItem(KEY);location.reload()}">Borrar todo</button></div>
  <input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='finanzas-cerogrados.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render()}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
const PK='cg_priv';let P=JSON.parse(localStorage.getItem(PK)||'null')||{pin:'',sv:[],meta:0};
const sp=()=>localStorage.setItem(PK,JSON.stringify(P));
const hs=s=>{let x=5381;for(const ch of s)x=(x*33^ch.charCodeAt(0))>>>0;return''+x};
let tap=0,tt;
function secret(){tap++;clearTimeout(tt);tt=setTimeout(()=>tap=0,1500);if(tap>=5){tap=0;openPriv()}}
function askPin(t,cb){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#2B106699;display:flex;align-items:center;justify-content:center;z-index:99';
  o.innerHTML=`<div class="card" style="width:280px"><h2>${t}</h2><input id="pin" type="password" inputmode="numeric" maxlength="6" style="margin:12px 0"><div style="display:flex;gap:8px"><button class="btn pk" id="ok" style="flex:1">Entrar</button><button class="btn ghost" id="no">Cancelar</button></div></div>`;
  document.body.appendChild(o);const i=o.querySelector('#pin');i.focus();
  const done=v=>{o.remove();if(v!==null)cb(v)};
  o.querySelector('#ok').onclick=()=>done(i.value);o.querySelector('#no').onclick=()=>done(null);i.onkeydown=e=>{if(e.key==='Enter')done(i.value)}}
function openPriv(){
  if(!P.pin)askPin('Crea un PIN (4 a 6 números)',v=>{if(!/^\d{4,6}$/.test(v))return alert('PIN no válido');P.pin=hs(v);sp();view='priv';render()});
  else askPin('PIN',v=>{if(hs(v)!==P.pin)return alert('PIN incorrecto');view='priv';render()})}
function addPv(){const v=parseFloat(document.getElementById('pv').value);if(!v)return;P.sv.push({f:new Date().toLocaleDateString('es-PE'),m:v});sp();render()}
function delPv(i){P.sv.splice(i,1);sp();render()}
function vPriv(){const t=P.sv.reduce((a,x)=>a+ +x.m,0);
  return`<h1>🎁 Mi ahorro privado</h1><div class="grid"><div class="card"><div class="sub">Total ahorrado</div><div class="big">${fmt(t)}</div>${P.meta?bar(t,P.meta)+`<div class="sub">Meta ${fmt(P.meta)}</div>`:''}
  <div class="f"><div><label>Monto (S/)</label><input id="pv" type="number" inputmode="decimal"></div><div><label>Meta (opcional)</label><input type="number" value="${P.meta||''}" onchange="P.meta=parseFloat(this.value)||0;sp();render()"></div></div>
  <button class="btn pk" style="width:100%" onclick="addPv()">Registrar ahorro</button>
  <div style="margin-top:12px">${P.sv.map((x,i)=>`<div class="li"><span>${x.f}</span><span><b>${fmt(x.m)}</b> &nbsp;<a onclick="delPv(${i})">quitar</a></span></div>`).reverse().join('')}</div>
  <button class="btn ghost" style="width:100%;margin-top:12px" onclick="go('inicio')">Cerrar y ocultar</button></div></div>`}
function render(){
  const[y,m]=ym.split('-');let t=new Date(y,m-1,1).toLocaleDateString('es-PE',{month:'long',year:'numeric'});
  document.getElementById('pl').textContent=t[0].toUpperCase()+t.slice(1);
  document.getElementById('nav').innerHTML=NAV.map(n=>`<a class="${view===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('');
  document.getElementById('tabs').innerHTML=NAV.map(n=>`<a class="${view===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</a>`).join('');
  document.getElementById('app').innerHTML={inicio:vInicio,personal:vPersonal,cero:vCero,config:vConfig,priv:vPriv}[view]()}
render();
</script>
</body>
</html>
